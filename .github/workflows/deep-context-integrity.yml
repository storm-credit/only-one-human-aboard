name: Deep Context Materialize + Integrity

permissions:
  contents: write

on:
  push:
    branches:
      - prewriting/deep-context-410
    paths:
      - 'docs/prewriting-v3/EPISODE-BLUEPRINT-ACT*-v0.1.md'
      - 'docs/obsidian-v3/**'
      - 'docs/qa/**'
      - 'docs/design-v3/V3-CURRENT-AUTHORITY-MAP.md'
      - 'docs/current-work-status.md'
      - 'docs/NEXT-CHAT-HANDOFF.md'
      - 'tools/compile_deep_contexts.py'
      - 'tools/compile_deep_contexts_v2.py'
      - 'tools/deep_context_integrity.py'
      - 'tools/finalize_deep_context_docs.py'
      - '.github/workflows/deep-context-integrity.yml'

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize Deep Context completion documentation
        run: python tools/finalize_deep_context_docs.py

      - name: Compile Deep Projected Context 410/410
        run: python tools/compile_deep_contexts_v2.py --preserve-through 28

      - name: Validate full Deep Projected Context contract
        run: python tools/deep_context_integrity.py

      - name: Commit materialized Deep Context and completion docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs
          if git diff --cached --quiet; then
            echo "Deep Context and completion docs already current."
          else
            git commit -m "Finalize Deep Context 410/410 and completion QA"
            git push origin HEAD:prewriting/deep-context-410
          fi
